[build-system]
requires = ["setuptools>=70.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plane-above"
description = "What’s flying up there, huh?"
authors = [{name = "Ilia Andreevich"}]
dynamic = ["version"]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "aviation",
    "aircraft",
    "planes",
    "flight-tracking",
    "air-traffic",
    "opensky",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.28.0",
    "lxml>=5.1.0",
    "python-dateutil>=2.9.0",
    "country-converter>=1.3.2",  # will be removed in 1.0.0
    "pandas<3.1",  # country-converter breaks on pandas 3.1
]

[project.urls]
Repository = "https://github.com/wrongcredentials/plane-above"
Changelog = "https://github.com/wrongcredentials/plane-above/blob/main/CHANGELOG.md"
Issues = "https://github.com/wrongcredentials/plane-above/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<9.1.2",
    "pytest-asyncio>=1.4.0,<1.5.0",
    "pytest-httpx>=0.36.2,<0.37.0",
    "pytest-cov>=7.1.0,<7.2.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "prek>=0.5.7",
]

[tool.setuptools.dynamic]
version = {attr = "plane_above.__version__"}

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
exclude = ["tests/__init__.py"]

[tool.ruff.lint]
ignore = [
    "PLR2004",  # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/__init__.py" = ["E501", "RUF012"]

[tool.ruff.lint.pylint]
max-args = 10
max-returns = 8

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
length-sort = true

[tool.pytest.ini_options]
addopts = "-vv --cov --cov-report term-missing --cov-fail-under=90"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["plane_above"]
omit = ["tests/*", "*/tests/*"]

[tool.mypy]
files = ["plane_above", "scripts"]
python_version = "3.10"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.markdownlint-cli2]
fix = true

[tool.markdownlint-cli2.config]
default = true
MD001 = false
MD013 = false
MD024 = {siblings_only = true}
MD033 = false
MD059 = false
